<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Stepless Busan</title>
    <script type="text/javascript">
      // SPA Redirect script for GitHub Pages custom domain
      var l = window.location;
      var path = l.pathname;
      var search = l.search;
      var hash = l.hash;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/?p=' + encodeURIComponent(path) +
        (search ? '&q=' + encodeURIComponent(search.slice(1)) : '') +
        hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
